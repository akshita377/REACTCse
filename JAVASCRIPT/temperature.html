<!DOCTYPE html>
<html>
<body>

<h2>Celsius to Fahrenheit</h2>

<input type="number" id="celsius">
<button onclick="convert()">Convert</button>

<p id="result"></p>

<script>
function convert()
{
    let c = document.getElementById("celsius").value;
    let f = (c * 9/5) + 32;

    document.getElementById("result").innerHTML =
    "Fahrenheit = " + f;
}
</script>

</body>
</html>
