<!DOCTYPE html>
<html>
<head>
    <title>Const Example</title>
</head>
<body>
<script>
    const X = 10;
    document.write(X);

    document.write("<br>");

    const name = "Akshita";
    const age = 30;
    const city = "Delhi";

    document.write(name);
    document.write("<br>");
    document.write(age);
    document.write("<br>");
    document.write(city);
</script>
</body>
</html>
