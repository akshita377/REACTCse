<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //increment
        for( i=1;i<=10;i++)
        document.write(i + "<br>");
        //string
        for( i=1;i<=10;i++)
        document.write("CSE13"+ "<br>");
        //decrement
        for( i=10;i>=0;i--)
        document.write(i + "<br>");
    </script>

</body>
</html>
