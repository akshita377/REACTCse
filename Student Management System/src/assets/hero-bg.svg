  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="95" fill="#cbd5e1" fill-opacity="0.35" filter="url(#blur)"/>
  <circle cx="680" cy="100" r="80" fill="#e2e8f0" fill-opacity="0.45"/>
  <circle cx="550" cy="420" r="120" fill="url(#halo)"/>
  <rect x="80" y="380" width="280" height="160" rx="30" fill="#e5e7eb" fill-opacity="0.55"/>
